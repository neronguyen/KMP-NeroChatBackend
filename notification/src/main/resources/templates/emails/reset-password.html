<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<h1>Password reset request</h1>
<p>Hi <span th:text="${displayName}">there</span>,</p>
<p>Reset your Nero Chat password using this link:</p>
<p><a th:href="${resetPasswordUrl}">Reset password</a></p>
<p>This link expires in <span th:text="${expiresInMinutes}">15</span> minutes and can only be used once.</p>
<p>If you didn't request a password reset, you can ignore this email.</p>
</body>
</html>
